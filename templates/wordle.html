<!DOCTYPE html>
<html lang="en">
<head>
    <!-- iOS / Apple Home Screen Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Crossword">

    <!-- Android / Chrome Web App Manifest -->
    <link rel="manifest" href="/static/site.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    {% include '_sw.html' %}
    {% include '_viewport_fix.html' %}
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon/192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon/512.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <title>Wordle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media'
        }
    </script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        body { background: #f1f5f9; }
        @media (prefers-color-scheme: dark) {
            body { background: #1c1c1e; }
        }

        #page { height: 100%; }

        /* Wordle tile grid */
        #board-container {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 0;
        }

        #board {
            display: grid;
            grid-template-rows: repeat(var(--max-guesses, 6), 1fr);
            grid-gap: 5px;
            width: 100%;
            max-width: 330px;
            height: 100%;
            max-height: 400px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(var(--word-length, 5), 1fr);
            grid-gap: 5px;
        }

        .tile {
            border: 2px solid #d3d6da;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
            perspective: 1000px;
            border-radius: 4px;
            color: #0f172a;
        }
        @media (prefers-color-scheme: dark) {
            .tile { border-color: #3a3a3c; color: #f1f5f9; }
        }

        .tile.flip {
            animation: flip 0.8s ease-in-out forwards;
        }

        @keyframes flip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .tile.shake {
            animation: shake 0.75s ease-in-out;
        }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }

        .tile[data-state="correct"] { background-color: #6aaa63; border-color: #6aaa63; color: white; }
        .tile[data-state="present"] { background-color: #c9b458; border-color: #c9b458; color: white; }
        .tile[data-state="absent"]  { background-color: #787c7e; border-color: #787c7e; color: white; }
        @media (prefers-color-scheme: dark) {
            .tile[data-state="correct"] { background-color: #538d4e; border-color: #538d4e; color: white; }
            .tile[data-state="present"] { background-color: #b59f3b; border-color: #b59f3b; color: white; }
            .tile[data-state="absent"] { background-color: #3a3a3c; border-color: #3a3a3c; }
        }

        /* Keyboard */
        #keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            flex-shrink: 0;
            padding: 0 8px;
            padding-bottom: 4.3rem;
        }

        .k-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .key {
            background-color: #d3d6da;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 16px 0;
            font-weight: bold;
            font-size: 1.2rem;
            flex: 1;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        @media (prefers-color-scheme: dark) {
            .key { background-color: #828384; color: #f1f5f9; }
        }

        .key.wide { flex: 1.5; font-size: 0.75rem; }
        .key[data-state="correct"] { background-color: #6aaa63; color: white; }
        .key[data-state="present"] { background-color: #c9b458; color: white; }
        .key[data-state="absent"]  { background-color: #787c7e; color: white; }
        @media (prefers-color-scheme: dark) {
            .key[data-state="correct"] { background-color: #538d4e; color: white; }
            .key[data-state="present"] { background-color: #b59f3b; color: white; }
            .key[data-state="absent"]  { background-color: #3a3a3c; color: white; }
        }

        #toast-container {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9000;
            pointer-events: none;
        }
        .toast {
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            animation: fadeInOut 2.5s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .toolbtn.active { background: #111 !important; color: white !important; }
        @media (prefers-color-scheme: dark) {
            .toolbtn.active { background: #2563eb !important; color: white !important; }
        }
    </style>
</head>
<body class="font-sans">
    <div id="toast-container"></div>

    <!-- Result Modal (win or loss) -->
    <div id="result-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[10000] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-neutral-900 rounded-2xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform transition-all border border-slate-100 dark:border-neutral-700">
            <div id="modal-emoji" class="text-5xl mb-3">🎉</div>
            <h2 id="modal-title" class="text-2xl font-black text-slate-900 dark:text-white mb-1">Nice!</h2>
            <p id="modal-subtitle" class="text-sm font-medium text-slate-600 dark:text-neutral-400 mb-4">You got it!</p>

            <div class="bg-slate-50 dark:bg-neutral-800 border border-slate-200 dark:border-neutral-700 rounded-xl p-4 mb-6">
                <p id="modal-word" class="font-bold text-slate-800 dark:text-slate-100 text-lg tracking-widest mb-1">&nbsp;</p>
                <div class="flex items-center justify-center gap-1.5 text-slate-600 dark:text-neutral-400 text-sm font-semibold">
                    <span>🔢 Guesses:</span>
                    <span id="modal-guess-count" class="font-mono text-slate-900 dark:text-white">0/6</span>
                </div>
            </div>

            <button onclick="closeResultModal()" class="w-full bg-slate-900 hover:bg-black dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-semibold py-3 px-6 rounded-xl transition active:scale-95 shadow-md">
                Close
            </button>
        </div>
    </div>

    <div id="page" class="max-w-6xl mx-auto bg-white dark:bg-[#1c1c1e] shadow-sm flex flex-col h-screen">

        <!-- Header -->
        <header class="flex items-center gap-2 px-3 py-2 border-b border-slate-200 dark:border-neutral-700 shrink-0"
                 style="padding-top: max(0.5rem, env(safe-area-inset-top));">
            <button onclick="goBack()"
                    aria-label="Back"
                    class="text-slate-700 dark:text-neutral-300 hover:text-black dark:hover:text-white text-2xl leading-none w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-neutral-800 transition">
                &#8249;
            </button>
            <div class="flex-1 min-w-0">
                <p class="font-semibold text-slate-900 dark:text-white truncate text-sm">The Wordle</p>
                <p id="puzzle-date" class="text-xs text-slate-500 dark:text-neutral-400 truncate"></p>
            </div>

            <!-- Hard mode toggle -->
            <button id="hard-mode-btn" onclick="toggleHardMode()"
                    class="toolbtn px-3 h-9 rounded-full flex items-center justify-center text-xs font-semibold border border-slate-300 dark:border-neutral-700 hover:bg-slate-100 dark:hover:bg-neutral-800 transition"
                    title="Hard mode: revealed hints must be used in every later guess">
                HARD
            </button>

            <!-- Guess Counter -->
            <div id="guess-counter" class="font-mono font-bold text-sm text-slate-700 dark:text-neutral-300 bg-slate-100 dark:bg-neutral-800 px-2.5 py-1 rounded-md border border-slate-200 dark:border-neutral-700 select-none">
                0/6
            </div>
        </header>

        <div id="unavailable-view" class="hidden flex-1 flex items-center justify-center p-6">
            <div class="text-center max-w-sm">
                <p class="text-lg font-bold text-slate-800 dark:text-white mb-2">No puzzle for this day</p>
                <p class="text-sm text-slate-500 dark:text-neutral-400">This date is either in the future or before the Wordle archive started.</p>
            </div>
        </div>
        <div id="board-container">
            <div id="board" style="--max-guesses: 6;"></div>
        </div>

        <div id="keyboard">
            <div class="k-row" id="k1"></div>
            <div class="k-row" id="k2"></div>
            <div class="k-row" id="k3"></div>
        </div>
    </div>

    <script id="wordle-boot" type="application/json">
        {{ (boot or none) | tojson }}
    </script>

    <script>
        function goBack() {
            const back = new URLSearchParams(window.location.search).get('back');
            let dest = '/';
            // Only ever follow a same-origin link: ?back= is attacker-controllable
            // (e.g. "javascript:..." or another site), so anything else goes home.
            try {
                const u = new URL(back || '/', window.location.origin);
                if (u.origin === window.location.origin) dest = u.pathname + u.search + u.hash;
            } catch (e) { /* malformed -> home */ }
            window.location.href = dest;
        }
    </script>

    <script>
        function parseDateFromUrl() {
            const m = window.location.pathname.match(/^\/wordle\/(\d{4})\/(\d{1,2})\/(\d{1,2})\/?$/);
            if (!m) return { year: '', month: '', day: '' };
            return {
                year: m[1].padStart(4, '0'),
                month: m[2].padStart(2, '0'),
                day: m[3].padStart(2, '0')
            };
        }

        const BOOT = (() => {
            try { return JSON.parse(document.getElementById('wordle-boot').textContent); } catch (e) { return null; }
        })();
        const meta = (BOOT && BOOT.year) ? { year: BOOT.year, month: BOOT.month, day: BOOT.day } : parseDateFromUrl();
        if (meta.year) {
            document.title = `Wordle · ${meta.year}-${meta.month}-${meta.day}`;
        }

        let TARGET = "";
        let WORD_LENGTH = 5;
        let MAX_ATTEMPTS = 6;
        let gameReady = false;

        document.getElementById('board').style.setProperty('--word-length', WORD_LENGTH);

        let currentRow = 0;
        let currentTile = 0;
        let guesses = [];          // submitted words, e.g. ["CRANE", "SLATE"]
        let results = [];          // parallel array of result arrays, e.g. [["absent","present",...], ...]
        let currentGuessLetters = Array(WORD_LENGTH).fill("");
        let gameOver = false;
        let isWon = false;
        let busy = false;          // true while a submitted guess is still flipping; blocks all input

        // --- Valid guess dictionary (fetched once, cached in memory) ---
        let VALID_WORDS = null;
        async function loadValidWords() {
            try {
                // Served with a long Cache-Control + ETag, so after the first
                // visit this is answered from the browser cache.
                const res = await fetch('/api/wordle-valid-words');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                VALID_WORDS = new Set(
                    text.split(/\s+/).filter(Boolean).map(w => w.toUpperCase())
                );
            } catch (e) {
                console.error("Error loading valid word list:", e);
                VALID_WORDS = new Set(); // fail closed: only TARGET will be accepted
            }
        }
        loadValidWords();

        // --- Header date label ---
        if (meta.year) {
            const d = new Date(parseInt(meta.year), parseInt(meta.month) - 1, parseInt(meta.day));
            const label = d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            document.getElementById('puzzle-date').textContent = label;
        }

        // --- Build grid ---
        const board = document.getElementById("board");
        function buildGrid() {
            board.innerHTML = "";
            board.style.setProperty('--max-guesses', MAX_ATTEMPTS);
            board.style.setProperty('--word-length', WORD_LENGTH);
            for (let i = 0; i < MAX_ATTEMPTS; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < WORD_LENGTH; j++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }
        }
        buildGrid();

        // --- Build keyboard ---
        const layout = [
            ["Q","W","E","R","T","Y","U","I","O","P"],
            ["A","S","D","F","G","H","J","K","L"],
            ["ENTER","Z","X","C","V","B","N","M","DEL"]
        ];

        layout.forEach((row, i) => {
            const container = document.getElementById(`k${i+1}`);
            row.forEach(key => {
                const btn = document.createElement("button");
                btn.className = `key ${key.length > 1 ? 'wide' : ''}`;
                btn.textContent = key === "DEL" ? "⌫" : key;
                btn.dataset.key = key;
                btn.onclick = () => handleKey(key);
                // Keep focus off the on-screen keys: a focused key would be
                // "clicked" again by the physical Enter/Space key and type its letter.
                btn.addEventListener("mousedown", (e) => e.preventDefault());
                container.appendChild(btn);
            });
        });

        document.addEventListener("keydown", (e) => {
            if (!gameReady || gameOver) return;
            // Leave browser/OS shortcuts (Ctrl+R, Cmd+C, Alt+Left ...) alone.
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key === "Enter") { e.preventDefault(); handleKey("ENTER"); }
            else if (e.key === "Backspace") handleKey("DEL");
            else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
        });

        // ---- Hard mode ----
        // Every guess must reuse all hints revealed so far: green letters stay in place,
        // yellow letters must appear somewhere. Can only be switched on before the first guess.
        const HARD_PREF_KEY = 'wordle-hard-mode';                                   // last choice, used for new puzzles
        const HARD_PUZZLE_KEY = `wordle-hard-${meta.year}-${meta.month}-${meta.day}`; // this puzzle's own choice
        const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

        let hardMode = false;
        function initHardMode(saved) {
            const g = saved && saved.userGrid;
            const started = !!(g && Array.isArray(g.guesses) && g.guesses.length > 0);
            if (started) {
                hardMode = g.hard === true;            // started puzzles keep their own setting
            } else {
                const own = lsGet(HARD_PUZZLE_KEY);    // toggled here before, but no guess yet
                hardMode = (own !== null ? own : lsGet(HARD_PREF_KEY)) === '1';
            }
            document.getElementById('hard-mode-btn').classList.toggle('active', hardMode);
        }

        function toggleHardMode() {
            if (!gameReady || gameOver) return;

            // Turning ON is only allowed before the first guess.
            if (!hardMode && guesses.length > 0) {
                showToast("Hard mode can only be turned on before your first guess");
                return;
            }

            hardMode = !hardMode;
            lsSet(HARD_PREF_KEY, hardMode ? '1' : '0');      // remembered for new puzzles
            lsSet(HARD_PUZZLE_KEY, hardMode ? '1' : '0');    // this puzzle's own choice
            document.getElementById('hard-mode-btn').classList.toggle('active', hardMode);
            showToast(hardMode ? "Hard mode on" : "Hard mode off");

            if (guesses.length > 0) saveProgress();
        }

        function ordinal(n) {
            const v = n % 100;
            if (v >= 11 && v <= 13) return n + 'th';
            return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
        }

        // Returns an error message if `guess` ignores a hint from an earlier guess, else null.
        function hardModeViolation(guess) {
            for (let g = 0; g < guesses.length; g++) {
                const prev = guesses[g], res = results[g];
                if (!prev || !res) continue;

                // Green letters must stay in their position.
                for (let i = 0; i < WORD_LENGTH; i++) {
                    if (res[i] === 'correct' && guess[i] !== prev[i]) {
                        return `${ordinal(i + 1)} letter must be ${prev[i]}`;
                    }
                }
                // Green + yellow letters must appear at least as many times as revealed.
                const need = {};
                for (let i = 0; i < WORD_LENGTH; i++) {
                    if (res[i] === 'correct' || res[i] === 'present') need[prev[i]] = (need[prev[i]] || 0) + 1;
                }
                for (const letter in need) {
                    const have = guess.split(letter).length - 1;
                    if (have < need[letter]) return `Guess must contain ${letter}`;
                }
            }
            return null;
        }

        function updateGuessCounter() {
            document.getElementById('guess-counter').textContent = `${guesses.length}/${MAX_ATTEMPTS}`;
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function saveProgress() {
            const saveUrl = `/api/progress/Wordle/${meta.year}/${meta.month}/${meta.day}`;
            fetch(saveUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userGrid: { guesses: guesses, results: results, hard: hardMode },
                    timerSeconds: guesses.length,   // repurposed for Wordle: number of guesses used
                    ratio: guesses.length / MAX_ATTEMPTS,
                    completed: gameOver,
                    usedCheck: isWon   // repurposed for Wordle: true = won, false = lost
                })
            }).then(r => {
                if (r.status === 401) showToast('Signed out - progress not saved. Please log in again.');
                else if (!r.ok) showToast('Could not save progress - check your connection.');
            }).catch(e => console.error("Error saving progress:", e));
        }

        function computeResult(guess) {
            const targetArr = TARGET.split("");
            const result = Array(WORD_LENGTH).fill("absent");

            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guess[i] === targetArr[i]) {
                    result[i] = "correct";
                    targetArr[i] = null;
                }
            }
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (result[i] !== "correct" && targetArr.includes(guess[i])) {
                    result[i] = "present";
                    targetArr[targetArr.indexOf(guess[i])] = null;
                }
            }
            return result;
        }

        function applyKeyboardState(guess, result) {
            for (let i = 0; i < WORD_LENGTH; i++) {
                const keyBtn = document.querySelector(`.key[data-key="${guess[i]}"]`);
                if (!keyBtn) continue;
                const currentState = keyBtn.dataset.state;
                if (result[i] === "correct" || (result[i] === "present" && currentState !== "correct")) {
                    keyBtn.dataset.state = result[i];
                } else if (!currentState) {
                    keyBtn.dataset.state = result[i];
                }
            }
        }

        // Render a previously-submitted row instantly (no animation), used when resuming a game.
        function renderSavedRow(rowIdx, guess, result) {
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = document.getElementById(`tile-${rowIdx}-${i}`);
                tile.textContent = guess[i];
                tile.dataset.state = result[i];
            }
            applyKeyboardState(guess, result);
        }

        function handleKey(key) {
            if (!gameReady || gameOver || busy) return;

            if (key === "DEL") {
                if (currentTile > 0) {
                    currentTile--;
                    currentGuessLetters[currentTile] = "";
                    document.getElementById(`tile-${currentRow}-${currentTile}`).textContent = "";
                }
            } else if (key === "ENTER") {
                if (currentTile === WORD_LENGTH) submitGuess();
            } else if (currentTile < WORD_LENGTH && key.length === 1) {
                currentGuessLetters[currentTile] = key;
                document.getElementById(`tile-${currentRow}-${currentTile}`).textContent = key;
                currentTile++;
            }
        }

        function shakeCurrentRow() {
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                tile.classList.remove("shake");
                void tile.offsetWidth; // force reflow so the animation restarts
                tile.classList.add("shake");
                tile.addEventListener("animationend", () => tile.classList.remove("shake"), { once: true });
            }
        }

        function submitGuess() {
            const guess = currentGuessLetters.join("");

            if (VALID_WORDS === null) {
                showToast("Still loading dictionary…");
                return;
            }
            if (guess !== TARGET && !VALID_WORDS.has(guess)) {
                shakeCurrentRow();
                showToast("Not in word list");
                return;
            }

            if (hardMode) {
                const violation = hardModeViolation(guess);
                if (violation) {
                    shakeCurrentRow();
                    showToast(violation);
                    return;
                }
            }

            const result = computeResult(guess);
            busy = true;   // until the flip finishes: no typing, deleting or re-submitting (a 2nd Enter used to count the guess twice)

            const STAGGER_DELAY = 250;
            const FLIP_DURATION = 800;

            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                tile.style.animationDelay = `${i * STAGGER_DELAY}ms`;
                tile.classList.add("flip");

                setTimeout(() => {
                    tile.dataset.state = result[i];
                }, (i * STAGGER_DELAY) + (FLIP_DURATION / 2));
            }

            const totalAnimationTime = ((WORD_LENGTH - 1) * STAGGER_DELAY) + FLIP_DURATION + 100;
            setTimeout(() => {
                applyKeyboardState(guess, result);

                guesses.push(guess);
                results.push(result);
                updateGuessCounter();
                busy = false;

                if (guess === TARGET) {
                    finishGame(true);
                } else if (currentRow === MAX_ATTEMPTS - 1) {
                    finishGame(false);
                } else {
                    currentRow++;
                    currentTile = 0;
                    currentGuessLetters = Array(WORD_LENGTH).fill("");
                    saveProgress();
                }
            }, totalAnimationTime);
        }

        function finishGame(won) {
            gameOver = true;
            isWon = won;
            saveProgress();

            if (won) {
                showToast(`Solved in ${guesses.length}/${MAX_ATTEMPTS}!`);
            } else {
                showToast(`Out of guesses. Word was ${TARGET}`);
            }
            showResultModal(won);
        }

        function showResultModal(won) {
            document.getElementById('modal-emoji').textContent = won ? '🎉' : '😔';
            document.getElementById('modal-title').textContent = won ? 'Nice!' : 'So Close!';
            document.getElementById('modal-subtitle').textContent = won
                ? `Solved in ${guesses.length}/${MAX_ATTEMPTS} guesses`
                : `Better luck tomorrow`;
            document.getElementById('modal-word').textContent = TARGET;
            document.getElementById('modal-guess-count').textContent = `${guesses.length}/${MAX_ATTEMPTS}`;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function closeResultModal() {
            document.getElementById('result-modal').classList.add('hidden');
        }

        function loadProgress(saved) {
            if (saved && saved.userGrid && saved.userGrid.guesses) {
                guesses = saved.userGrid.guesses;
                results = saved.userGrid.results || [];
                // Rebuild any missing/short result rows from the guess itself, so a
                // partially saved game still renders instead of throwing.
                guesses = guesses.filter(g => typeof g === 'string' && g.length === WORD_LENGTH);
                results = guesses.map((g, idx) => Array.isArray(results[idx]) && results[idx].length === WORD_LENGTH
                    ? results[idx] : computeResult(g));
                guesses.forEach((g, idx) => renderSavedRow(idx, g, results[idx]));
                currentRow = guesses.length;
                currentTile = 0;
                currentGuessLetters = Array(WORD_LENGTH).fill("");
            }
            updateGuessCounter();

            if (saved && saved.completed) {
                gameOver = true;
                isWon = !!saved.usedCheck;
                if (isWon) {
                    showToast(`Solved in ${guesses.length}/${MAX_ATTEMPTS}`);
                } else {
                    showToast(`Word was ${TARGET}`);
                }
            }
        }

        function applyBoot(data) {
            if (!data || data.unavailable || !data.target_word) {
                document.getElementById('board-container').classList.add('hidden');
                document.getElementById('keyboard').classList.add('hidden');
                document.getElementById('unavailable-view').classList.remove('hidden');
                return;
            }
            const nextLen = data.target_word.length;
            const nextAttempts = data.max_guesses || 6;
            const needRebuild = nextLen !== WORD_LENGTH || nextAttempts !== MAX_ATTEMPTS;
            TARGET = data.target_word;
            WORD_LENGTH = nextLen;
            MAX_ATTEMPTS = nextAttempts;
            currentGuessLetters = Array(WORD_LENGTH).fill("");
            if (needRebuild) buildGrid();

            const saved = data.saved || {};
            initHardMode(saved);
            gameReady = true;
            loadProgress(saved);
        }

        (async function init() {
            if (BOOT) {
                applyBoot(BOOT);
                return;
            }
            if (!meta.year) {
                applyBoot({ unavailable: true });
                return;
            }
            try {
                const res = await fetch(`/api/game/wordle/${meta.year}/${meta.month}/${meta.day}`, { cache: 'no-store' });
                if (res.status === 401) { window.location.href = '/login'; return; }
                if (!res.ok) { showToast('Could not load puzzle.'); return; }
                applyBoot(await res.json());
            } catch (e) {
                console.error('Error loading Wordle:', e);
                showToast('Could not load puzzle.');
            }
        })();
    </script>
</body>
</html>
