<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <title>Login · Crossword</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media'
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-[#1c1c1e] flex items-center justify-center min-h-screen p-4"
      style="padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: max(1rem, env(safe-area-inset-bottom));">
    <div class="bg-white dark:bg-neutral-900 dark:border dark:border-neutral-800 p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h1 id="form-title" class="text-2xl font-black text-slate-900 dark:text-white mb-6 text-center">Welcome Back</h1>

        <div id="error-msg" class="hidden mb-4 p-3 text-sm bg-red-100 dark:bg-red-950/40 border border-red-300 dark:border-red-900 text-red-700 dark:text-red-300 rounded-lg"></div>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Username</label>
                <input type="text" id="username" required class="w-full px-4 py-2 border border-slate-300 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">
                Log In
            </button>
        </form>

        <div class="mt-6 text-center">
            <button onclick="toggleMode()" id="toggle-btn" class="text-sm text-blue-600 dark:text-blue-400 hover:underline font-semibold">
                Don't have an account? Sign Up
            </button>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').textContent = isLogin ? 'Welcome Back' : 'Create Account';
            document.getElementById('submit-btn').textContent = isLogin ? 'Log In' : 'Sign Up';
            document.getElementById('toggle-btn').textContent = isLogin
                ? "Don't have an account? Sign Up"
                : "Already have an account? Log In";
            document.getElementById('error-msg').classList.add('hidden');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');
            errorEl.classList.add('hidden');

            const endpoint = isLogin ? '/api/login' : '/api/register';
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                window.location.href = '/';
            } else {
                errorEl.textContent = data.error || 'Authentication failed';
                errorEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
