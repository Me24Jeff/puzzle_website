services:
  web:
    build: .
    image: crossword-app:latest
    container_name: crossword-web
    restart: unless-stopped
    working_dir: /app/data
    environment:
      TZ: Asia/Jerusalem
      COOKIE_SECURE: 1
      # Secrets live in ./.env (git-ignored, see .env.example) - never put real
      # values in this file. If FLASK_SECRET_KEY is empty the app generates a
      # key once and keeps it in the data folder.
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      PYTHONPATH: /app
      ADMIN_USERNAMES: jonathan
    volumes:
      - /opt/appdata/crossword:/app/data
    command: >
      gunicorn app:app
      --bind 0.0.0.0:5235
      --workers 2
      --timeout 60
      --preload
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5235/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
     - reverse-proxy

  scraper:
    build: .
    image: crossword-app:latest
    container_name: crossword-scraper
    restart: unless-stopped
    working_dir: /app/data
    environment:
      TZ: America/New_York
      # NYT-S session cookie, required for daily/mini/midi crosswords (NOT
      # needed for Wordle or Spelling Bee scrapers - those are free).
      # Set it in ./.env (see .env.example), not here.
      NYT_S_COOKIE: ${NYT_S_COOKIE:-}
    volumes:
      - /opt/appdata/crossword:/app/data
    # Default CMD from the Dockerfile (cron-entrypoint.sh) runs cron in the
    # foreground on the schedule in docker/crontab.

networks:
  reverse-proxy:
    external: true
