services:
  web:
    build: .
    image: crossword-app:latest
    container_name: crossword-web
    restart: unless-stopped
    working_dir: /app/data
    environment:
      TZ: America/New_York
      FLASK_SECRET_KEY: a65cb14fb41dd3022ee2827ad9d71e164a29d222a679ad99cc77677c8444ed45
      PYTHONPATH: /app
    volumes:
      - /opt/appdata/crossword:/app/data
    ports:
      - "5235:5235"
    command: >
      gunicorn app:app
      --bind 0.0.0.0:5235
      --workers 2
      --timeout 60

  scraper:
    build: .
    image: crossword-app:latest
    container_name: crossword-scraper
    restart: unless-stopped
    working_dir: /app/data
    environment:
      TZ: America/New_York
      # NYT-S session cookie, required for daily/mini/midi crosswords (NOT
      # needed for Wordle or Spelling Bee scrapers - those are free).
      NYT_S_COOKIE: ${NYT_S_COOKIE:-}
    volumes:
      - /opt/appdata/crossword:/app/data
    # Default CMD from the Dockerfile (cron-entrypoint.sh) runs cron in the
    # foreground on the schedule in docker/crontab.
